<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Artiros makes Kalix, a scientific graphing calculator for iPhone, iPad, Mac and Apple Watch.">
<link rel="canonical" href="https://artiros-studio.github.io/">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f6fa;
    --text: #1d1d1f;
    --muted: #5a5f6b;
    --accent: #011f5b;
    --border: #dfe3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #1b1e23;
      --text: #f2f2f4;
      --muted: #a4a9b4;
      --accent: #6e9ceb;
      --border: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 56px; }
  header { margin-bottom: 28px; }
  .app { color: var(--accent); font-weight: 700; letter-spacing: 0.02em; margin: 0 0 6px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; margin: 36px 0 10px; color: var(--accent); }
  h3 { font-size: 1.05rem; margin: 22px 0 6px; }
  p, li { margin: 0 0 12px; overflow-wrap: break-word; }
  ul, ol { padding-left: 1.25em; margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin: 0 0 12px;
  }
  .card p:last-child, .card ul:last-child, .card ol:last-child { margin-bottom: 0; }
  nav.toc { font-size: 0.95rem; }
  nav.toc a { display: inline-block; margin: 0 14px 6px 0; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
  footer a { margin-right: 16px; }
</style>

<main>
  <header>
    <p class="app">Artiros</p>

    <h2 style="margin-top:0">Kalix</h2>
    <p>A scientific graphing calculator with computer algebra for iPhone, iPad and Mac, with an Apple Watch app.</p>
    <p><a href="kalix/support.html">Support</a> &middot; <a href="kalix/privacy.html">Privacy Policy</a></p>
  </div>
  <footer class="muted">
    <p>Contact: <a href="mailto:support.artiros@icloud.com">support.artiros@icloud.com</a></p>
  </footer>
